services:
  postgres:
    image: postgres:17-alpine
    container_name: ssm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssm
      POSTGRES_PASSWORD: ssm
      POSTGRES_DB: ssm
    ports:
      - "5433:5432"
    volumes:
      - ssm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssm -d ssm"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    container_name: ssm-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - ssm-redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ssm-pgdata:
  ssm-redisdata:
